name: forgeops

# Docker is optional. By default ForgeOps uses the database in DATABASE_URL (Supabase).
#   docker compose --profile local-db up -d postgres   -> local Postgres instead
#   docker compose up -d --build api                   -> run the API in a container

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
