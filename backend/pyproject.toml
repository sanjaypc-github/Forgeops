[project]
name = "forgeops"
version = "0.1.0"
description = "ForgeOps incident investigation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "cryptography>=50",
    "sse-starlette>=3.4",
    "structlog>=26.1",
    "openai>=3.16.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.2",
    "mcp>=2.2.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
